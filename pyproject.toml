[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey-legal-rag"
version = "0.1.0"
description = "Structure-aware legal contract RAG with hybrid retrieval and reranking"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "numpy>=1.24", "faiss-cpu>=1.7.4", "rank-bm25>=0.2.2", "sentence-transformers>=3.0", "torch>=2.0", "langgraph>=0.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
claude = ["anthropic>=0.40"]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.per-file-ignores]
# Historical v1 definitions precede the active v2 graph/report; retain until a separate cleanup.
"src/legal_rag/evidence_agent.py" = ["F811"]
